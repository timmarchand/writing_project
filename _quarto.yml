project:
  type: book

book:
  title: "[Working title of your thesis]"
  author: "Tim Marchand"
  date: today
  chapters:
    - index.qmd
    - 00-introduction.qmd
    - 01-literature-review-cmc.qmd
    - 02-literature-review-lcr.qmd
    - 03-methodology.qmd
    - 04-analysis.qmd
    - 05-discussion.qmd
    - 06-conclusion.qmd
    - references.qmd

bibliography: references.bib

format:
  typst:
    toc: true
    number-sections: true
    fig-width: 6
    fig-height: 4

# Cache expensive computation (e.g. dtagger/PPML model fits) between
# renders. Deliberately NOT gitignored below, so a fresh clone or your
# second Mac can render from cache instead of recomputing everything.
execute:
  freeze: auto
