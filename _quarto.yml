project:
  type: book
  output-dir: _book
  render:
    - "*.qmd"
    - "notes/*.qmd"

book:
  title: "Evaluation Below the Line: A Register-Based Learner Corpus Study of Stance in Online News Comments"
  author: "Tim Marchand"
  date: today
  chapters:
    - index.qmd
    - 00-introduction.qmd
    - 01-literature-review-cmc.qmd
    - 02-literature-review-lcr.qmd
    - 03-methodology.qmd
    - 04-results.qmd
    - 05-discussion.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
  pdf:
    pdf-engine: typst
    toc: true
    number-sections: true
    papersize: a4
    margin:
      x: 2.5cm
      y: 3cm
    mainfont: "Linux Libertine"
    fontsize: 11pt

# Cache expensive computation (e.g. dtagger/PPML model fits) between
# renders. Deliberately NOT gitignored below, so a fresh clone or your
# second Mac can render from cache instead of recomputing everything.
execute:
  freeze: auto
